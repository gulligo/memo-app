<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>용용이 메모장</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.png" type="image/png" />
<link rel="apple-touch-icon" href="icon.png" />
<style>
:root{--bg:#f5f5f7;--card:#fff;--border:#e5e5ea;--primary:#007aff;--text:#1c1c1e;--muted:#8e8e93;--red:#ff3b30;--green:#34c759;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.header{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
.header-title{font-size:18px;font-weight:700;}
.icon-btn{border:none;background:none;font-size:22px;color:var(--primary);padding:4px;cursor:pointer;}
.main-view{padding:12px;}
.group-item{background:var(--card);border-radius:12px;margin-bottom:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.group-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;user-select:none;}
.group-name{font-size:16px;font-weight:700;}
.group-arrow{font-size:12px;color:var(--muted);transition:transform .2s;}
.group-arrow.open{transform:rotate(90deg);}
.group-children{display:none;border-top:1px solid var(--border);}
.group-children.open{display:block;}
.sub-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 12px 28px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;}
.sub-item:last-child{border-bottom:none;}
.sub-name{font-size:15px;}
.sub-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.sub-arrow{font-size:16px;color:var(--muted);}
.memo-view{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:200;flex-direction:column;}
.memo-view.show{display:flex;}
.memo-header{background:#fff;border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.back-btn{border:none;background:none;font-size:36px;color:var(--primary);padding:0 8px 0 0;cursor:pointer;line-height:1;}
.save-btn{border:none;background:var(--primary);color:#fff;border-radius:8px;padding:7px 16px;font-size:15px;font-weight:700;cursor:pointer;}
.memo-body{flex:1;overflow-y:auto;padding:12px;padding-top:16px;-webkit-overflow-scrolling:touch;position:relative;}
.toolbar{background:#fff;border-top:1px solid var(--border);padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0;}
.tool-btn{border:none;background:var(--bg);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;}
.block{margin-bottom:8px;position:relative;}
.checklist-block{background:var(--card);border-radius:10px;padding:8px 12px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.check-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.check-item:last-child{border-bottom:none;}
.check-item input[type="checkbox"]{width:20px;height:20px;accent-color:var(--primary);flex-shrink:0;}
.check-item-text{flex:1;border:none;background:none;font-size:15px;color:var(--text);outline:none;font-family:inherit;}
.check-item-text.done{text-decoration:line-through;color:var(--muted);}
.add-check-btn{display:flex;align-items:center;gap:6px;color:var(--primary);font-size:14px;border:none;background:none;padding:8px 0;cursor:pointer;width:100%;}
.block-del{display:none;position:absolute;top:6px;right:6px;background:rgba(0,0,0,.4);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:11px;align-items:center;justify-content:center;cursor:pointer;z-index:10;}
.block-handle{display:none;position:absolute;top:8px;left:8px;background:rgba(0,0,0,.2);color:#fff;border:none;border-radius:6px;width:22px;height:22px;font-size:11px;align-items:center;justify-content:center;cursor:grab;z-index:10;touch-action:none;}
.photo-block{border-radius:10px;padding:4px;}
.photo-item{position:relative;margin-bottom:6px;border-radius:8px;}
.photo-item img{width:100%;display:block;border-radius:8px;transform-origin:center center;}
.photo-done-btn{display:none;position:absolute;bottom:8px;left:8px;background:var(--green);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;z-index:5;}
.photo-item.editing .photo-done-btn{display:block;}
.photo-del{display:none;position:absolute;top:6px;right:6px;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;width:26px;height:26px;font-size:14px;align-items:center;justify-content:center;cursor:pointer;z-index:5;}
.photo-item.editing .photo-del{display:flex;}
.free-text{position:absolute;min-width:80px;max-width:70%;z-index:50;touch-action:none;}
.free-text-bubble{background:rgba(255,255,255,.92);border-radius:14px;padding:8px 12px;font-size:14px;color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.15);min-height:36px;word-break:break-word;white-space:pre-wrap;cursor:move;user-select:none;border:2px solid transparent;}
.free-text.transparent .free-text-bubble{background:transparent;box-shadow:none;text-shadow:0 1px 3px rgba(255,255,255,.8);}
.free-text.selected.transparent .free-text-bubble{border:2px dashed var(--primary);}
.free-text.selected .free-text-bubble{border-color:var(--primary);}
.free-text-edit{display:none;position:absolute;top:0;left:0;right:0;min-height:36px;border:2px solid var(--primary);background:rgba(255,255,255,.97);border-radius:14px;padding:8px 12px;font-size:14px;color:var(--text);outline:none;resize:none;font-family:inherit;z-index:51;}
.free-text.editing .free-text-edit{display:block;}
.free-text.editing .free-text-bubble{visibility:hidden;}
.free-text-done{display:none;position:absolute;top:-28px;right:0;background:var(--green);color:#fff;border:none;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;cursor:pointer;z-index:52;}
.free-text-del{display:none;position:absolute;top:-28px;right:52px;background:var(--red);color:#fff;border:none;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;cursor:pointer;z-index:52;}
.free-text.selected .free-text-done{display:block;}
.free-text.selected .free-text-del{display:block;}
.split-block{display:flex;gap:8px;border-radius:10px;padding:8px;margin-bottom:8px;}
.split-photo{flex:1;border-radius:8px;overflow:hidden;}
.split-photo img{width:100%;display:block;border-radius:8px;}
.split-text{flex:1;border:none;background:var(--bg);border-radius:8px;padding:8px;font-size:14px;color:var(--text);outline:none;resize:none;font-family:inherit;min-height:100px;}
.video-block{background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:8px;}
.video-frame{width:100%;aspect-ratio:16/9;border:none;border-radius:8px;}
.video-url-input{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;outline:none;font-family:inherit;margin-bottom:8px;}
.video-add-btn{width:100%;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:10px;font-size:14px;font-weight:600;cursor:pointer;}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:400;align-items:flex-end;}
.modal-overlay.show{display:flex;}
.modal{background:var(--card);border-radius:16px 16px 0 0;padding:20px 16px;width:100%;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:12px;}
.modal-input{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:15px;outline:none;font-family:inherit;margin-bottom:12px;}
.modal-btns{display:flex;gap:8px;}
.modal-btn{flex:1;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;}
.modal-btn.confirm{background:var(--primary);color:#fff;}
.modal-btn.cancel{background:var(--bg);color:var(--text);}
.ctx-menu{display:none;position:fixed;background:var(--card);border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.15);overflow:hidden;z-index:500;min-width:160px;}
.ctx-menu.show{display:block;}
.ctx-item{padding:12px 16px;font-size:15px;cursor:pointer;border-bottom:1px solid var(--border);}
.ctx-item:last-child{border-bottom:none;}
.ctx-item.danger{color:var(--red);}
.drag-handle{margin-right:10px;color:var(--muted);font-size:18px;cursor:grab;user-select:none;touch-action:none;flex-shrink:0;}
.dragging{opacity:.55;}
.ov{display:none;position:fixed;inset:0;z-index:600;background:var(--bg);flex-direction:column;padding:12px;overflow-y:auto}.ov.show{display:flex}
.gal{background:var(--card);border-radius:10px;padding:8px}.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:6px}
.gg div{position:relative;aspect-ratio:1;background:#d8dde2}.gg img{width:100%;height:100%;object-fit:cover}.gg b{position:absolute;right:4px;bottom:2px;color:#fff}
#gv{background:#0b1015;color:#fff;padding:0}#gv .m{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#gv .m img,#gv .m video{max-width:100%;max-height:100%}#gv .bar{display:flex;gap:8px;padding:10px;align-items:center}
#map{height:55vh;border-radius:10px;margin-bottom:8px}.fbtn{display:inline-block;background:var(--primary);color:#fff;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
#galv{padding:0;flex-direction:row}
#galv .side{width:92px;flex:none;background:#fff;border-right:1px solid var(--border);overflow-y:auto}
#galv .side div{padding:14px 8px;font-size:13px;font-weight:600;border-bottom:1px solid var(--border);word-break:break-all}
#galv .side div.on{background:var(--primary);color:#fff}
#galv .main{flex:1;min-width:0;overflow-y:auto}
#galv .top{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--border);padding:8px;display:flex;gap:8px;align-items:center}
#galv .dh{padding:10px 8px 4px;font-size:12px;font-weight:700;color:var(--muted)}
#galv .pg{display:grid;grid-template-columns:repeat(3,1fr);gap:1px}
@media(min-width:700px){#galv .pg{grid-template-columns:repeat(6,1fr)}}
#galv .pg div{position:relative;aspect-ratio:1;background:#d8dde2}#galv .pg img{width:100%;height:100%;object-fit:cover}#galv .pg b{position:absolute;right:4px;bottom:2px;color:#fff}
</style>
</head>
<body>
<div class="header">
<div class="header-title">용용이 메모장</div>
<div style="display:flex;gap:8px;">
<button class="icon-btn" onclick="openGal()">🖼</button>
<button class="icon-btn" onclick="openMap()">🗺</button>
<button class="icon-btn" onclick="openSteps()">👣</button>
<button class="icon-btn" onclick="backupData()">💾</button>
<button class="icon-btn" onclick="restoreData()">📂</button>
<button class="icon-btn" onclick="showAddGroupModal()">➕</button>
</div>
</div>

<div class="main-view"><div id="groupList"></div></div>

<div class="memo-view" id="memoView">
<div class="memo-header">

<button class="save-btn" id="saveBtn" onclick="saveMemo()">저장</button>
</div>

<button class="tool-btn" onclick="addFreeText('white')">💬 말풍선</button>
<button class="tool-btn" onclick="addFreeText('transparent')">🔤 투명말풍선</button>
<button class="tool-btn" onclick="addChecklistBlock()">☑️ 체크</button>
<button class="tool-btn" onclick="addPhotoBlock()">🖼 사진</button>
<button class="tool-btn" onclick="addVideoBlock()">🎬 동영상</button>
<button class="tool-btn" onclick="addGallery()">📷 갤러리</button>
</div>
</div>

<div class="modal-overlay" id="modalOverlay">
<div class="modal">
<div class="modal-title" id="modalTitle"></div>
<input class="modal-input" id="modalInput" placeholder="이름 입력" />
<div class="modal-btns">
<button class="modal-btn cancel" onclick="closeModal()">취소</button>
<button class="modal-btn confirm" id="modalConfirmBtn">확인</button>
</div>
</div>
</div>

<div class="ctx-menu" id="ctxMenu">
<div class="ctx-item" id="ctxRename">이름 변경</div>
<div class="ctx-item" id="ctxAddSub">소그룹 추가</div>
<div class="ctx-item danger" id="ctxDelete">삭제</div>
</div>

<div class="ov" id="galv">
<div class="side" id="gside"></div>
<div class="main"><div class="top"><button class="modal-btn cancel" style="flex:none;padding:8px 12px" onclick="$('#galv').classList.remove('show')">닫기</button><span id="gtt" style="flex:1;font-weight:700"></span><label class="fbtn">＋ 올리기<input type="file" accept="image/*,video/*" multiple hidden onchange="upP([...this.files],$('#gst'));this.value=''" /></label></div><small id="gst" style="padding:4px 8px;color:var(--muted)"></small><div id="gbody"></div></div>
</div>
<div class="ov" id="login">
<div class="modal-title">로그인</div>
<input class="modal-input" id="em" type="email" placeholder="이메일" />
<input class="modal-input" id="pw" type="password" placeholder="비밀번호" />
<div class="modal-btns"><button class="modal-btn cancel" onclick="$('#login').classList.remove('show')">건너뛰기</button><button class="modal-btn confirm" onclick="doLogin()">로그인</button></div>
</div>
<div class="ov" id="mapv">
<div class="modal-btns" style="flex:none;margin-bottom:8px"><button class="modal-btn cancel" onclick="$('#mapv').classList.remove('show')">닫기</button>
<label class="modal-btn confirm" style="text-align:center">GPX 올리기<input type="file" accept=".gpx" hidden onchange="addGpx(this.files[0]);this.value=''" /></label></div>
<div id="map"></div><div id="trk"></div>
</div>
<div class="ov" id="stv">
<button class="modal-btn cancel" style="flex:none;margin-bottom:8px" onclick="$('#stv').classList.remove('show')">닫기</button>
<div style="display:flex;gap:8px;margin-bottom:8px"><input class="modal-input" id="sd" type="date" style="margin:0" /><input class="modal-input" id="sn" type="number" placeholder="걸음 수" style="margin:0" /><button class="modal-btn confirm" style="flex:none" onclick="saveStep()">저장</button></div>
<div id="sl"></div>
</div>
<div class="ov" id="gv">
<div class="bar"><button class="modal-btn cancel" style="flex:none" onclick="closeG()">닫기</button><span id="gc"></span><span style="flex:1"></span><button class="modal-btn" style="flex:none;background:var(--red);color:#fff" onclick="delG()">삭제</button></div>
<div class="m" id="gm"></div>
<div class="bar"><button class="modal-btn cancel" onclick="mvG(-1)">‹</button><button class="modal-btn cancel" onclick="mvG(1)">›</button></div>
</div>

<input type="file" id="photoInput" accept="image/*" multiple style="display:none" />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
<script>
const KEY = 'memo_app_v1';
const DB_NAME = 'YongYongDB';
let db;
let data = { groups: [] };

const request = indexedDB.open(DB_NAME, 1);
request.onupgradeneeded = e => { e.target.result.createObjectStore("memos"); };
request.onsuccess = e => { db = e.target.result; loadData(); };

function loadData() {
if (!db) return;
const req = db.transaction(["memos"], "readonly").objectStore("memos").get("main");
req.onsuccess = () => {
if (req.result) { data = req.result; }
else { const old = localStorage.getItem(KEY); if (old) data = JSON.parse(old); }
render();
pull();
};
}

function putLocal() { db.transaction(["memos"], "readwrite").objectStore("memos").put(data, "main"); }

function saveData() {
if (!db) return;
data.ts = Date.now();
putLocal();
clearTimeout(pushT);
pushT = setTimeout(push, 1500);
}

let currentGroupId=null,currentSubId=null,currentMemo=null;
let ctxTarget=null,ctxType=null,modalCallback=null;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}

function getSubMeta(s){
if(!s.blocks||!s.blocks.length)return '비어있음';
const parts=[];
if(s.blocks.filter(b=>b.type==='freetext').length)parts.push('말풍선');
if(s.blocks.filter(b=>b.type==='checklist').length)parts.push('체크');
if(s.blocks.filter(b=>b.type==='photo').length)parts.push('사진');
if(s.blocks.filter(b=>b.type==='video'&&b.url).length)parts.push('동영상');
if(s.blocks.filter(b=>b.type==='gallery').length)parts.push('갤러리');
return parts.join(' · ')||'비어있음';
}

function moveArrayItem(arr, fromIndex, toIndex){
if(fromIndex===toIndex || fromIndex<0 || toIndex<0) return;
const item=arr.splice(fromIndex,1)[0];
arr.splice(toIndex,0,item);
}

function enableGroupDrag(handle,item,gid){
let dragging=false;
handle.addEventListener('touchstart',e=>{dragging=true;item.classList.add('dragging');e.stopPropagation();},{passive:true});
handle.addEventListener('touchmove',e=>{
if(!dragging) return;
e.preventDefault();
const y=e.touches[0].clientY;
const items=[...document.querySelectorAll('.group-item')];
const current=item;
for(const target of items){
if(target===current) continue;
const rect=target.getBoundingClientRect();
if(y>rect.top && y<rect.bottom){
const currentIndex=items.indexOf(current);
const targetIndex=items.indexOf(target);
moveArrayItem(data.groups,currentIndex,targetIndex);
saveData();
render();
break;
}
}
},{passive:false});
handle.addEventListener('touchend',()=>{dragging=false;item.classList.remove('dragging');});
}

function enableSubDrag(handle,item,gid,sid){
let dragging=false;
handle.addEventListener('touchstart',e=>{dragging=true;item.classList.add('dragging');e.stopPropagation();},{passive:true});
handle.addEventListener('touchmove',e=>{
if(!dragging) return;
e.preventDefault();
const y=e.touches[0].clientY;
const g=data.groups.find(x=>x.id===gid);
if(!g) return;
const subItems=[...document.querySelectorAll(`.group-children[data-parent-group="${gid}"] .sub-item[data-sid]`)];
const current=item;
for(const target of subItems){
if(target===current) continue;
const rect=target.getBoundingClientRect();
if(y>rect.top && y<rect.bottom){
const currentIndex=subItems.indexOf(current);
const targetIndex=subItems.indexOf(target);
moveArrayItem(g.subs,currentIndex,targetIndex);
saveData();
render();
break;
}
}
},{passive:false});
handle.addEventListener('touchend',()=>{dragging=false;item.classList.remove('dragging');});
}

function render(){
const list=document.getElementById('groupList');
list.innerHTML='';
data.groups.forEach(g=>{
const item=document.createElement('div');
item.className='group-item';
item.dataset.gid=g.id;
const header=document.createElement('div');
header.className='group-header';
const left=document.createElement('div');
left.style.display='flex';
left.style.alignItems='center';
const handle=document.createElement('span');
handle.className='drag-handle';
handle.textContent='☰';
const name=document.createElement('div');
name.className='group-name';
name.textContent=g.name;
left.appendChild(handle);
left.appendChild(name);
const arrow=document.createElement('span');
arrow.className='group-arrow'+(g.open?' open':'');
arrow.textContent='▶';
header.appendChild(left);
header.appendChild(arrow);
header.addEventListener('click',e=>{
if(e.target===handle) return;
toggleGroup(g.id);
});
header.addEventListener('contextmenu',e=>showCtx(e,'group',g.id));
enableGroupDrag(handle,item,g.id);
const children=document.createElement('div');
children.className='group-children'+(g.open?' open':'');
children.dataset.parentGroup=g.id;
(g.subs||[]).forEach(s=>{
const si=document.createElement('div');
si.className='sub-item';
si.dataset.sid=s.id;
const subLeft=document.createElement('div');
subLeft.style.display='flex';
subLeft.style.alignItems='center';
subLeft.style.gap='10px';
const subHandle=document.createElement('span');
subHandle.className='drag-handle';
subHandle.textContent='☰';
const subTextWrap=document.createElement('div');
subTextWrap.innerHTML=`<div class="sub-name">${s.name}</div><div class="sub-meta">${getSubMeta(s)}</div>`;
subLeft.appendChild(subHandle);
subLeft.appendChild(subTextWrap);
const subArrow=document.createElement('span');
subArrow.className='sub-arrow';
subArrow.textContent='›';
si.appendChild(subLeft);
si.appendChild(subArrow);
si.addEventListener('click',e=>{
if(e.target===subHandle) return;
openMemo(g.id,s.id);
});
si.addEventListener('contextmenu',e=>showCtx(e,'sub',s.id,g.id));
enableSubDrag(subHandle,si,g.id,s.id);
children.appendChild(si);
});
const addSub=document.createElement('div');
addSub.className='sub-item';
addSub.style.cssText='color:var(--primary);justify-content:center;';
addSub.textContent='+ 소그룹 추가';
addSub.addEventListener('click',()=>showAddSubModal(g.id));
children.appendChild(addSub);
item.appendChild(header);
item.appendChild(children);
list.appendChild(item);
});
}

function toggleGroup(gid){
const g=data.groups.find(x=>x.id===gid);
if(g){g.open=!g.open;saveData();render();}
}

function openMemo(gid,sid){
currentGroupId=gid;
currentSubId=sid;
const g=data.groups.find(x=>x.id===gid);
const s=g.subs.find(x=>x.id===sid);
currentMemo=JSON.parse(JSON.stringify(s));
renderMemoBody();

function collectMemoBlocks() {

body.querySelectorAll('.block[data-bid]').forEach(el => {

if (block) {
if (block.type === 'checklist') {
const items = [];
el.querySelectorAll('.check-item').forEach(ci => {
items.push({text: ci.querySelector('.check-item-text').value, done: ci.querySelector('input[type="checkbox"]').checked});
});
block.items = items;
}
newBlocks.push(block);
}
});

const origTop=parseInt(ft.style.top)||0;

document.getElementById('photoInput').addEventListener('change', function(e) {
const bid = this.dataset.bid;
const files = Array.from(e.target.files);
if (!files.length) return;
files.forEach(file => {
const reader = new FileReader();
reader.onload = ev => {
const img = new Image();
img.onload = () => {
const canvas = document.createElement('canvas');
const max_size = 1000;
let width = img.width;
let height = img.height;
if (width > height) {
if (width > max_size) { height *= max_size / width; width = max_size; }
} else {
if (height > max_size) { width *= max_size / height; height = max_size; }
}
canvas.width = width;
canvas.height = height;
canvas.getContext('2d').drawImage(img, 0, 0, width, height);
const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
if (bid === 'split') {
currentMemo.blocks.push({ id: uid(), type: 'split', photo: dataUrl, text: '' });
} else {
currentMemo.blocks.push({ id: uid(), type: 'photo', photos: [dataUrl], transforms: [{ r: 0, s: 1, x: 0, y: 0 }] });
}
renderMemoBody();
};
img.src = ev.target.result;
};
reader.readAsDataURL(file);
});
this.value = '';
});

del.onclick=async()=>{if(!confirm('갤러리와 안의 사진이 모두 삭제됩니다.'))return;if(await has())await B().remove(b.items.flatMap(i=>[i.p,i.t]));currentMemo.blocks=currentMemo.blocks.filter(x=>x.id!==b.id);renderMemoBody()};
wrap.appendChild(del);
if(await has())await sign(b.items.map(i=>i.t));
g.querySelector('.gg').innerHTML=b.items.map((i,n)=>`<div onclick="viewG('${b.id}',${n})"><img src="${urls[i.t]||''}">${i.k==='v'?'<b>▶</b>':''}</div>`).join('')}
async function upGal(b,fs,st){if(!(await sess()))return;let n=0;
for(const f of fs){st.textContent=`올리는 중 ${++n}/${fs.length} (영상은 시간이 걸립니다. 화면을 켜 두세요)`;
try{b.items.push(await one(f,b.id))}catch(e){alert(f.name+' 실패: '+e.message)}}
saveMemo();renderMemoBody()}
async function rs(src,w,q){const b=src instanceof Blob?await createImageBitmap(src,{imageOrientation:'from-image'}):src;
const s=Math.min(1,w/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*s|0;c.height=b.height*s|0;
c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',q))}
const once=(e,ev)=>new Promise((r,j)=>{e.addEventListener(ev,r,{once:true});e.addEventListener('error',()=>j(new Error('읽기 실패')),{once:true})});
async function vthumb(f){const v=document.createElement('video');v.muted=true;v.playsInline=true;v.src=URL.createObjectURL(f);await once(v,'loadeddata');
v.currentTime=Math.min(.5,v.duration||0);await once(v,'seeked');return rs(await createImageBitmap(v),400,.7)}
async function packV(f){try{const v=document.createElement('video');v.playsInline=true;v.volume=0;v.src=URL.createObjectURL(f);await once(v,'loadedmetadata');
const s=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=v.videoWidth*s&~1;c.height=v.videoHeight*s&~1;
const x=c.getContext('2d'),out=c.captureStream(30);await v.play();(v.captureStream?v.captureStream():new MediaStream()).getAudioTracks().forEach(t=>out.addTrack(t));
const mt=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
const rec=new MediaRecorder(out,{mimeType:mt,videoBitsPerSecond:2e6}),ch=[];rec.ondataavailable=e=>ch.push(e.data);
const done=new Promise(r=>rec.onstop=r);rec.start(1000);
(function d(){if(v.ended)return;x.drawImage(v,0,0,c.width,c.height);requestAnimationFrame(d)})();
await once(v,'ended');rec.stop();await done;const o=new Blob(ch,{type:mt.split(';')[0]});return o.size&&o.size<f.size?o:f}catch(e){return f}}
async function one(f,bid){const v=f.type.startsWith('video'),id=uid(),d='g/'+bid+'/';let m,t,lat,lng,ext='jpg';
if(v){m=await packV(f);t=await vthumb(f);ext=m===f?(f.name.split('.').pop()||'mp4'):m.type.includes('mp4')?'mp4':'webm'}
else{const g=await exifr.gps(f).catch(()=>null);if(g){lat=g.latitude;lng=g.longitude}m=await rs(f,1600,.8);t=await rs(f,400,.7)}
const p=d+id+'.'+ext,tp=d+'t_'+id+'.jpg';
for(const[a,x,c]of[[p,m,m.type||'video/mp4'],[tp,t,'image/jpeg']]){const{error}=await B().upload(a,x,{contentType:c});if(error)throw error}
return{id,p,t:tp,k:v?'v':'p',lat,lng}}

/* ===== 뷰어 ===== */
let gi=[],gx=0,sx0=0;
let gOwner='memo';
async function viewG(bid,n){gOwner='memo';gi=currentMemo.blocks.find(x=>x.id===bid).items;gx=n;$('#gv').classList.add('show');await showG()}
async function showG(){const it=gi[gx];await sign([it.p]);const u=urls[it.p];
$('#gm').innerHTML=it.k==='v'?`<video src="${u}" controls autoplay playsinline></video>`:`<img src="${u}">`;$('#gc').textContent=`${gx+1} / ${gi.length}`}
const mvG=d=>{gx=(gx+d+gi.length)%gi.length;showG()};
function closeG(){$('#gv').classList.remove('show');$('#gm').innerHTML=''}
async function delG(){if(!confirm('이 사진을 삭제할까요?'))return;const it=gi[gx];await B().remove([it.p,it.t]);gi.splice(gx,1);closeG();
if(gOwner==='grp'){const g=data.groups.find(x=>x.id===galG);g.photos=g.photos.filter(x=>x.id!==it.id);saveData();renderGal()}else{saveMemo();renderMemoBody()}}
$('#gm').addEventListener('touchstart',e=>sx0=e.touches[0].clientX);
$('#gm').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx0;if(Math.abs(d)>50)mvG(d<0?1:-1)});

/* ===== 지도 + GPX ===== */
let map,mk=[],pl=[];
const pts=t=>[...new DOMParser().parseFromString(t,'text/xml').querySelectorAll('trkpt')].map(p=>[+p.getAttribute('lat'),+p.getAttribute('lon')]);
const km=a=>a.reduce((s,p,i)=>{if(!i)return 0;const q=a[i-1],r=Math.PI/180,x=Math.sin((p[0]-q[0])*r/2)**2+Math.cos(q[0]*r)*Math.cos(p[0]*r)*Math.sin((p[1]-q[1])*r/2)**2;return s+12742*Math.asin(Math.sqrt(x))},0);
async function openMap(){if(!(await sess()))return;$('#mapv').classList.add('show');
if(!map){map=L.map('map').setView([36.64,127.49],9);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map)}
setTimeout(()=>map.invalidateSize(),80);mk.forEach(m=>m.remove());mk=[];
const its=[...data.groups.flatMap(g=>g.photos||[]),...data.groups.flatMap(g=>(g.subs||[]).flatMap(s=>(s.blocks||[]).filter(b=>b.type==='gallery').flatMap(b=>b.items)))].filter(i=>i.lat!=null);
await sign(its.map(i=>i.t));its.forEach(i=>mk.push(L.marker([i.lat,i.lng]).addTo(map).bindPopup(`<img src="${urls[i.t]}" width="120">`)));
if(mk.length)map.fitBounds(L.featureGroup(mk).getBounds().pad(.2));loadTrk()}
async function loadTrk(){const{data:t}=await sb.from('tracks').select().order('created_at',{ascending:false});
$('#trk').innerHTML=(t||[]).map(x=>`<div class="group-item" style="padding:12px;display:flex;justify-content:space-between;align-items:center"><span>${esc(x.name)}<br><small style="color:var(--muted)">${x.km.toFixed(1)}km</small></span><span style="display:flex;gap:6px"><button class="tool-btn" onclick="showTrk('${x.path}')">보기</button><button class="tool-btn" onclick="dlTrk('${x.path}','${esc(x.name)}')">받기</button><button class="tool-btn" onclick="delTrk('${x.id}','${x.path}')">삭제</button></span></div>`).join('')}
async function addGpx(f){if(!f)return;const a=pts(await f.text());if(!a.length)return alert('경로 점을 찾지 못했습니다.');
const p='gpx/'+uid()+'.gpx';await B().upload(p,f,{contentType:'application/gpx+xml'});
await sb.from('tracks').insert({name:f.name.replace(/\.gpx$/i,''),path:p,km:km(a)});loadTrk()}
async function showTrk(p){const{data:d}=await B().createSignedUrl(p,300);const a=pts(await(await fetch(d.signedUrl)).text());
pl.forEach(l=>l.remove());pl=[L.polyline(a,{color:'#007aff',weight:4}).addTo(map)];map.fitBounds(pl[0].getBounds())}
async function dlTrk(p,n){const{data:d}=await B().createSignedUrl(p,60,{download:n+'.gpx'});location.href=d.signedUrl}
async function delTrk(id,p){if(!confirm('경로를 삭제할까요?'))return;await B().remove([p]);await sb.from('tracks').delete().eq('id',id);loadTrk()}

/* ===== 걸음 수 ===== */
async function openSteps(){if(!(await sess()))return;$('#sd').value=new Date().toISOString().slice(0,10);$('#stv').classList.add('show');loadSteps()}
async function saveStep(){const n=+$('#sn').value;if(!$('#sd').value||isNaN(n))return;await sb.from('steps').upsert({day:$('#sd').value,steps:n});$('#sn').value='';loadSteps()}
async function loadSteps(){const{data:r}=await sb.from('steps').select().order('day',{ascending:false}).limit(14);const mx=Math.max(1,...(r||[]).map(s=>s.steps));
$('#sl').innerHTML=(r||[]).map(s=>`<div style="margin:8px 0"><small style="color:var(--muted)">${s.day} · ${s.steps.toLocaleString()}걸음</small><div style="height:14px;border-radius:4px;background:var(--primary);width:${s.steps/mx*100}%"></div></div>`).join('')||'<small>기록이 없습니다.</small>'}

/* ===== 삼성 갤러리 스타일: 왼쪽 대그룹 / 오른쪽 사진 ===== */
let galG=null,galList=[];
async function openGal(){if(!(await sess()))return;$('#galv').classList.add('show');if(!data.groups.find(x=>x.id===galG)&&data.groups[0])galG=data.groups[0].id;renderGal()}
function pickG(id){galG=id;renderGal()}
async function renderGal(){
$('#gside').innerHTML=data.groups.map(g=>`<div class="${g.id===galG?'on':''}" onclick="pickG('${g.id}')">${esc(g.name)}<br><small>${(g.photos||[]).length}장</small></div>`).join('')||'<div>대그룹을 먼저 만들어 주세요</div>';
const g=data.groups.find(x=>x.id===galG);if(!g){$('#gtt').textContent='';$('#gbody').innerHTML='';return}
$('#gtt').textContent=g.name;g.photos=g.photos||[];
await sign(g.photos.map(i=>i.t));
galList=[...g.photos].sort((a,b)=>(b.at||0)-(a.at||0));const days={};
galList.forEach(i=>{const d=new Date(i.at||0),k=`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;(days[k]=days[k]||[]).push(i)});
$('#gbody').innerHTML=Object.keys(days).map(k=>`<div class="dh">${k}</div><div class="pg">${days[k].map(i=>`<div onclick="viewP('${i.id}')"><img src="${urls[i.t]||''}" loading="lazy">${i.k==='v'?'<b>▶</b>':''}</div>`).join('')}</div>`).join('')||'<div class="dh">사진이 없습니다. ＋ 올리기를 눌러 주세요.</div>'}
async function viewP(id){gOwner='grp';gi=galList;gx=galList.findIndex(x=>x.id===id);$('#gv').classList.add('show');await showG()}
async function upP(fs,st){if(!(await sess()))return;const g=data.groups.find(x=>x.id===galG);if(!g)return alert('왼쪽에서 대그룹을 먼저 선택해 주세요.');g.photos=g.photos||[];let n=0;
for(const f of fs){st.textContent=`올리는 중 ${++n}/${fs.length} (영상은 시간이 걸립니다. 화면을 켜 두세요)`;
try{const it=await one(f,g.id);let at=f.lastModified;if(!f.type.startsWith('video')){const ex=await exifr.parse(f,['DateTimeOriginal']).catch(()=>null);if(ex&&ex.DateTimeOriginal)at=+ex.DateTimeOriginal}it.at=at;g.photos.push(it);saveData()}catch(e){alert(f.name+' 실패: '+e.message)}}
st.textContent='';renderGal()}
</script>
